name: container-security

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "29 4 * * 1"  # Mondays at 04:29 UTC

permissions:
  contents: read
  security-events: write

jobs:
  trivy-images:
    name: Trivy scan images (matrix)
    # Skip entirely on private repos; we'll enable once the repo is public
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: traefik:v3.1
            label: traefik_v3.1
          - image: ubuntu/bind9:9.18-22.04_lts
            label: ubuntu_bind9_9.18-22.04_lts
          - image: nlnetlabs/unbound:1.21.1
            label: nlnetlabs_unbound_1.21.1
          - image: pihole/pihole:2024.07.0
            label: pihole_2024.07.0
    steps:
      - name: Pull image
        run: |
          docker pull ${{ matrix.image }}
      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ matrix.image }}
          format: 'sarif'
          output: 'trivy-${{ matrix.label }}.sarif'
          exit-code: '0'     # non-blocking; surfaces in code scanning
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.label }}.sarif'
        continue-on-error: true  # Don't fail the entire job if upload fails

