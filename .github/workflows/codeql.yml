name: codeql

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "14 3 * * 1"  # Mondays at 03:14 UTC, because why not

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL
    # Skip on private repos (Code scanning not enabled yet). Will run once the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

