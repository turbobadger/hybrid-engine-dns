# Feature request
name: Feature request
description: Suggest an idea to improve turboDNS
labels: [enhancement]
title: "[Feature] <short description>"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement!
  - type: input
    id: summary
    attributes:
      label: Summary
      description: What would you like to see changed or added?
      placeholder: "Support for DNS-over-TLS upstreams"
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this useful?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should this be implemented?
      placeholder: "Add Unbound with DoT upstreams and expose port 853"
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and Discussions
          required: true

